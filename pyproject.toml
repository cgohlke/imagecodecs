[build-system]
requires = ["setuptools", "numpy>=2.1", "Cython!=3.3.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 79
target-version = ["py312", "py313", "py314", "py315"]
skip-string-normalization = true

[tool.isort]
known_first_party = ["imagecodecs"]
profile = "black"
line_length = 79
